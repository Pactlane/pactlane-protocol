[package]
name = "pactlane-tests"
description = "Workspace-level contract tests: unit, integration, and later invariants and fuzz."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

# Shared fixtures in src/lib.rs need testutils as a normal dependency. This
# package only ever builds natively, so testutils never reaches a Wasm build.
[dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
pactlane-commerce = { path = "../contracts/commerce" }
pactlane-interfaces = { path = "../contracts/interfaces" }

[dev-dependencies]
hello-world = { path = "../contracts/hello-world" }

# Contract logic compiled natively; fast, no Wasm build required.
[[test]]
name = "unit"
path = "unit/main.rs"

# The compiled Wasm artifact, i.e. what actually gets deployed. Requires
# `scripts/build.sh` first.
[[test]]
name = "integration"
path = "integration/main.rs"
