specVersion: "1.0"

name: erc20-transfers
version: "0.1.0"
description: Index ERC-20 Transfer events into a queryable table.

network:
  family: evm
  chainId: "1"
  endpoint:
    - "https://ethereum-rpc.publicnode.com"

startBlock: 21000000

schema:
  file: "./schema.graphql"

dataSources:
  - kind: evm/Runtime
    name: usdc
    options:
      # USDC on Ethereum mainnet.
      address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
    assets:
      erc20:
        file: "./abis/ERC20.json"
    handlers:
      - handler: handle_transfer
        kind: evm/LogHandler
        filter:
          event: "Transfer(address,address,uint256)"
