[package]
name = "superquery-manifest"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
superquery-types = { path = "../types" }
serde_yaml_ng = "0.10"
semver = "1"
url = { version = "2", features = ["serde"] }
camino = { version = "1", features = ["serde1"] }
miette = { version = "7", features = ["derive"] }

[workspace]
